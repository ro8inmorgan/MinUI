---
name: Release NextUI

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        default: patch
        required: true
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      release_name: ${{ steps.name.outputs.release_name }}
      source_date_epoch: ${{ steps.epoch.outputs.value }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: version
        run: echo "tag=$(python3 scripts/release_version.py '${{ inputs.release_type }}')" >> "$GITHUB_OUTPUT"
      - name: Reject an existing release tag before building
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" || git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi
      - id: name
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.tag }}
        run: echo "release_name=$(make name)" >> "$GITHUB_OUTPUT"
      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

  core-matrix:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        toolchain: [tg5040, tg5050]
    outputs:
      cores: ${{ steps.cores.outputs.cores }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: cores
        env:
          PLATFORM: ${{ matrix.toolchain }}
        run: echo "cores=$(make cores-json)" >> "$GITHUB_OUTPUT"

  build-core:
    needs: core-matrix
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: true
      matrix:
        toolchain: [tg5040, tg5050]
        core: ${{ fromJson(needs.core-matrix.outputs.cores) }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make setup
      - name: Build and verify ${{ matrix.core }}
        env:
          PLATFORM: ${{ matrix.toolchain }}
        run: |
          make build-core CORE="${{ matrix.core }}"
          # shellcheck disable=SC2086 # intentional glob verifies the sole output.
          set -- workspace/$PLATFORM/cores/output/*.so
          test "$1" != "workspace/$PLATFORM/cores/output/*.so"
          test "$#" -eq 1
          test -s "$1"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: core-${{ matrix.toolchain }}-${{ matrix.core }}.zip
          path: workspace/${{ matrix.toolchain }}/cores/output/

  build:
    needs: [prepare, build-core]
    runs-on: ubuntu-24.04-arm
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.tag }}
      SOURCE_DATE_EPOCH: ${{ needs.prepare.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: make setup
      - uses: actions/download-artifact@v8.0.1
        with:
          path: workspace/tg5040/cores/output/
          pattern: core-tg5040-*
          merge-multiple: true
      - run: make tg5040
        env:
          PLATFORM: tg5040
      - uses: actions/download-artifact@v8.0.1
        with:
          path: workspace/tg5050/cores/output/
          pattern: core-tg5050-*
          merge-multiple: true
      - run: make tg5050 special package
        env:
          PLATFORM: tg5050
      - name: Rebuild the clean package staging tree and compare checksums
        run: |
          sha256sum releases/*.zip > first.sha256
          make setup tg5040 tg5050 special package
          sha256sum --check first.sha256
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-zips
          path: releases/*.zip
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: releases/*.zip

  release:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8.0.1
        with:
          path: releases/
          name: release-zips
      - name: Create the already-checked tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi
          git config user.email action@github.com
          git config user.name 'GitHub Action'
          git tag "$TAG"
          git push origin "$TAG"
      - uses: softprops/action-gh-release@v3
        with:
          files: releases/*
          generate_release_notes: true
          tag_name: ${{ needs.prepare.outputs.tag }}
          make_latest: "true"
